<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipes</title>
    <link rel="stylesheet" href="recipe.css">
    <script src="recipe.js" defer></script>

    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    
    <link rel="icon" href=".//images/__MACOSX/images/aria-label">

    <link rel="apple-touch-icon" href=".//images/__MACOSX/images/apple-touch-icon">
                    
</head>
<body>
    <header>
        <div class="logo-container">
            <img src="../ponderw09/images/images/recipe-book.png" alt="Logo of the recipe book website. The logo is a recipe book">
            <h1>RecipeBook</h1>
        </div>

        <search class="search-container">
            <form>
                <input type="search" placeholder="Find a recipe">
                <button type="submit">🔍</button>
            </form>
        </search>
    </header>

    <hr>
    <main>
        <section>
            <article class="recipe-box">
                <img src="../ponderw09/images/images/apple-crisp.jpg" alt="Apple crisp with ice cream in a bowl">
                
                <div class="recipe-info">
                    <button type="button">dessert</button>

                    <h2>Apple Crisp</h2>
                    <span
                        class="rating"
                        role="img"
                        aria-label="Rating: 4 out of 5 stars"
                    >
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star">⭐</span>
                        <span aria-hidden="true" class="icon-star-empty">☆</span>
                    </span>
                

                    <p>This apple crisp recipe is a simple yet delicious fall dessert that's great served warm with vanilla ice cream.</p>
                </div>
        </section>
    </main>

    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>       
        

        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
        <a href="#"><img src="../ponderw09/images/images/instagram_icon.svg" alt="instagram icon"></a>
        <a href="#"><img src="../ponderw09/images/images/youtube_icon.svg" alt="youtube icon"></a>
        <a href="#"><img src=".//images/images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                  
                
    </footer>
</body>
</html>
